name: Release package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version in VERSION to validate, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install package and release checks
        run: python -m pip install ".[dev]"
      - name: Verify release version
        run: |
          expected="$RELEASE_VERSION"
          if [[ -z "$expected" ]]; then
            expected="${GITHUB_REF_NAME#v}"
          fi
          test -n "$expected"
          test "$(tr -d '[:space:]' < VERSION)" = "$expected"
      - name: Validate repository baseline
        run: ./tests/validate.sh
      - name: Validate clean package contents
        run: ./tests/package.sh
      - name: Build release distributions
        run: python -m build --sdist --wheel --outdir release-dist .
      - name: Validate distribution metadata
        run: python -m twine check release-dist/*
      - name: Install the built wheel without dependencies
        run: python -m pip install --no-deps release-dist/*.whl
      - name: Run the installed package tests
        run: python -m pytest -q
      - name: Upload release distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: base-cli-demo-${{ env.RELEASE_VERSION || github.ref_name }}
          path: release-dist/
          if-no-files-found: error
