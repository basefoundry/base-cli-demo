name: Published release assets

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read

concurrency:
  group: published-release-assets-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  compatibility:
    if: ${{ github.event.release.prerelease == false }}
    name: ${{ matrix.base_cli.name }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        base_cli:
          - name: minimum-0.4.3
            spec: "==0.4.3"
          - name: latest-supported
            spec: ">=0.4.3,<0.5"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify the release tag matches VERSION
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "$(tr -d '[:space:]' < VERSION)" = "${RELEASE_TAG#v}"
      - name: Build the released demo wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install the framework version under test
        run: python -m pip install "base-cli${{ matrix.base_cli.spec }}" "pytest>=8,<9"
      - name: Install the release wheel without source dependencies
        run: python -m pip install --no-deps dist/*.whl
      - name: Run installed-wheel consumer tests
        run: python -m pytest -q
      - name: Record the exact compatibility evidence
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          BASE_CLI_REQUEST: ${{ matrix.base_cli.spec }}
        run: |
          python - <<'PY' > compatibility.txt
          from importlib.metadata import version
          import os

          print(f"python={os.environ['PYTHON_VERSION']}")
          print(f"base-cli-request={os.environ['BASE_CLI_REQUEST']}")
          print(f"base-cli-installed={version('base-cli')}")
          print(f"base-cli-demo-installed={version('base-cli-demo')}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compatibility-${{ matrix.base_cli.name }}-python-${{ matrix.python-version }}
          path: compatibility.txt
          if-no-files-found: error

  assets:
    if: ${{ github.event.release.prerelease == false }}
    needs: [compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify the release tag matches VERSION
        run: test "$(tr -d '[:space:]' < VERSION)" = "${RELEASE_TAG#v}"
      - name: Install package and release checks
        run: python -m pip install ".[dev]"
      - name: Run the authoritative consumer and package gates
        run: |
          ./tests/validate.sh
          ./tests/package.sh
      - name: Build the release distributions
        run: python -m build --sdist --wheel --outdir release-dist .
      - name: Verify distribution metadata
        run: python -m twine check release-dist/*
      - name: Install and test the built release wheel
        run: |
          python -m pip install --no-deps release-dist/*.whl
          python -m pytest -q
      - name: Download compatibility evidence from this workflow run
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'compatibility-*' --dir release-dist/compatibility-evidence
      - name: Prepare evidence and immutable checksums
        run: |
          {
            printf 'Release tag: %s\n' "$RELEASE_TAG"
            printf 'Declared Base-CLI range: base-cli>=0.4.3,<0.5\n\n'
            find release-dist/compatibility-evidence -name compatibility.txt -print -exec cat {} \;
          } > release-dist/COMPATIBILITY.txt
          sha256sum release-dist/*.whl release-dist/*.tar.gz release-dist/COMPATIBILITY.txt > release-dist/SHA256SUMS.txt
      - name: Attach release distributions, compatibility evidence, and checksums
        run: gh release upload "$RELEASE_TAG" release-dist/*.whl release-dist/*.tar.gz release-dist/COMPATIBILITY.txt release-dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
