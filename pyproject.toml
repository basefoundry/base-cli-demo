[build-system]
requires = ["setuptools>=68,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "base-cli-demo"
version = "0.1.0"
description = "Reference consumer and learning application for the base-cli framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "base-cli>=0.4.3,<0.5",
  "click>=8.1,<9",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "twine>=5,<7",
]
typer = [
  "typer>=0.12,<0.28",
]
rich = [
  "rich>=13.7,<15",
]
telemetry = [
  "opentelemetry-api>=1.24,<2",
]

[project.scripts]
northstar = "base_cli_demo.cli:main"
northstar-typer = "base_cli_demo.typer_scenario:main"
northstar-rich = "base_cli_demo.rich_scenario:main"
northstar-telemetry = "base_cli_demo.telemetry_scenario:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
base_cli_demo = ["fixtures/*.json"]
